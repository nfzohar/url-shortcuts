<div class="dialog-body">
  <div class="dialog-panel">
    <div class="panel-header">
      <span class="panel-title">Shortcuts Manager</span>

      <div class="service-switch-div" title="Toggle service on/off">
        <input
          type="checkbox"
          class="service-switch-input"
          id="service-state-toggle"
        />
        <span>Service is running</span>
      </div>

      <button id="modal-close-button" class="a-button" title="Close">X</button>
    </div>

    <hr />
    <div id="new-shortcut-form"></div>

    <hr />
    <div id="url-shortcuts-list" class="scrollbar-hide"></div>
  </div>
</div>
