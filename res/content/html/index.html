<div class="dialog-body">
  <div class="dialog-panel">
    <div class="panel-header">
      <h3 class="panel-title">Shortcuts Manager</h3>

      <div class="service-switch-box" title="Toggle service on/off">
        <input
          type="checkbox"
          class="service-switch"
          id="service-state-toggle"
        />
        <span>Service is running</span>
      </div>

      <button id="modal-close-button" title="Close">X</button>
    </div>

    <hr />
    <div id="new-shortcut-form"></div>

    <hr />
    <div id="shortcuts-list"></div>
  </div>
</div>
