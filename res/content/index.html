<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>URL Shortcut Manager</title>
    <link rel="stylesheet" href="style.css" />
    <script src="lib/tailwind-4.3.3.js"></script>
    <script src="modal.js"></script>
    <script src="../keys.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body class="bg-transparent">
    <!-- Full-screen overlay. Clicking it (outside the card) closes the modal. -->
    <div data-modal-backdrop class="flex min-h-screen items-center justify-center bg-black/40 p-4 font-sans">
      <div class="flex max-h-[calc(100vh-2rem)] w-full max-w-4xl flex-col rounded-xl bg-white text-gray-900 shadow-xl">
        <header class="flex items-center justify-between gap-4 border-b border-gray-200 px-6 py-4">
          <h1 class="text-lg font-bold">URL Shortcut Manager</h1>

          <div class="flex items-center gap-3">
            <label class="flex cursor-pointer items-center gap-2 text-sm">
              <input id="service-toggle" type="checkbox" class="size-4 cursor-pointer accent-gray-900" />
              Shortcuts enabled
            </label>
            <button
              data-close-modal
              aria-label="Close"
              class="cursor-pointer rounded-lg px-2 text-2xl leading-none text-gray-500 hover:bg-gray-100"
            >
              &times;
            </button>
          </div>
        </header>

        <form id="shortcut-form" class="flex flex-col gap-2 border-b border-gray-200 px-6 py-4">
          <h2 class="mb-1 font-semibold">Add a shortcut</h2>
          <div class="flex flex-wrap items-center gap-2 sm:flex-nowrap">
            <!-- Shows the shortcut. Clicking it listens for a new key combination (see app.js). -->
            <button
              id="record-button"
              type="button"
              aria-pressed="false"
              aria-live="polite"
              title="Click, then press the key combination. Escape cancels."
              class="flex h-10 w-full shrink-0 cursor-pointer items-center gap-1 overflow-hidden rounded-md border border-gray-300 px-2 text-left text-sm whitespace-nowrap text-gray-500 hover:bg-gray-50 aria-pressed:border-red-600 aria-pressed:outline-2 aria-pressed:outline-red-600 sm:w-64"
            ></button>
            <input
              id="urls-input"
              type="text"
              aria-label="URLs"
              placeholder="example-1.com, https://example-2.com…"
              class="h-10 min-w-0 flex-1 rounded-md border border-gray-300 px-2 text-sm"
            />
            <button
              type="submit"
              class="h-10 shrink-0 cursor-pointer rounded-lg bg-gray-900 px-3 text-sm font-semibold text-white hover:bg-gray-700"
            >
              Add shortcut
            </button>
          </div>

          <p id="form-message" class="text-sm text-gray-500">
            Browsers reserve some shortcuts, like Ctrl+T or Ctrl+W. Those can't be used.
          </p>
        </form>

        <div class="flex flex-wrap items-center gap-x-4 gap-y-2 px-6 pt-4">
          <h2 class="font-semibold">
            Your shortcuts
            <span id="shortcut-count" class="ml-1 text-sm font-normal text-gray-500"></span>
          </h2>
          <input
            id="search-input"
            type="search"
            aria-label="Search shortcuts"
            placeholder="Search by URL or keys…"
            class="h-9 w-full rounded-md border border-gray-300 px-2 text-sm sm:ml-auto sm:w-80"
          />
        </div>

        <!-- Fixed height, scrolls when there are more shortcuts. Shrinks if the window is too short. -->
        <div class="mx-6 mt-3 mb-6 h-80 min-h-0 shrink overflow-y-auto rounded-md border border-gray-200">
          <ul id="shortcut-list" class="divide-y divide-gray-100"></ul>
          <p id="empty-message" hidden class="py-8 text-center text-sm text-gray-500"></p>
        </div>
      </div>
    </div>
  </body>
</html>
